services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rigging
      POSTGRES_PASSWORD: rigging
      POSTGRES_DB: rigging
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rigging -d rigging"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg2://rigging:rigging@db:5432/rigging
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    environment:
      # 浏览器经 vite 代理访问 /api；Vitest 用 API_URL 直连真实接口
      API_PROXY_TARGET: http://api:8000
      API_URL: http://api:8000
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  db_data:
